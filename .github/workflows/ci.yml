name: CI

on:
  push:
    branches:
      - main
    paths:
      - "Lang Graph Gradio/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Lang Graph Gradio/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: test-key
      GROQ_MODEL: openai/gpt-oss-20b
      GRADIO_SERVER_PORT: 7860
    defaults:
      run:
        working-directory: Lang Graph Gradio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: Lang Graph Gradio/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Python syntax
        run: uv run python -m py_compile app.py graph.py

      - name: Smoke test app import
        run: |
          uv run python - <<'PY'
          import os
          os.environ['GROQ_API_KEY'] = 'test-key'
          import app
          print('Smoke import OK:', hasattr(app, 'chat_fn'))
          PY

      - name: Run tests when present
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            -not -path './.venv/*' -print -quit | grep -q .; then
            uv run --with pytest pytest
          else
            echo "No pytest test files found; skipping pytest."
          fi

  docker-smoke-test:
    name: Build image and smoke-test the container
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ./Lang Graph Gradio
          file: ./Lang Graph Gradio/Dockerfile
          push: false
          load: true
          tags: langgraph-gradio:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test running container
        shell: bash
        env:
          GROQ_API_KEY: ci-placeholder-key
        run: |
          docker run -d --name chatbot-ci \
            -p 7860:7860 \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            -e GRADIO_SERVER_NAME=0.0.0.0 \
            langgraph-gradio:ci-test
          # Wait for the app to become ready (max ~90s)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/healthz > /dev/null 2>&1; then
              echo "Health check passed after ${i} attempts"; break
            fi
            if [ "$i" = "30" ]; then
              docker logs chatbot-ci
              echo "::error::Container failed health check"; exit 1
            fi
            sleep 3
          done
          curl -fsS http://localhost:7860/healthz
          curl -fsS -o /dev/null -w "UI status: %{http_code}\n" http://localhost:7860/
          curl -fsS -o /dev/null -w "Config status: %{http_code}\n" http://localhost:7860/config
          docker rm -f chatbot-ci

      - name: Dump container logs on failure
        if: failure()
        run: docker logs chatbot-ci || true
