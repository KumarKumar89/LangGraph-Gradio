name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Lang Graph Gradio/**"
      - ".github/workflows/cd.yml"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and publish container
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/langgraph-gradio

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Lang Graph Gradio
          file: ./Lang Graph Gradio/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    needs: build-and-push
    if: ${{ secrets.AZURE_CONTAINER_APP_NAME != '' && secrets.AZURE_RESOURCE_GROUP != '' && secrets.AZURE_CONTAINERAPP_ENVIRONMENT != '' && secrets.AZURE_CREDENTIALS != '' }}
    runs-on: ubuntu-latest
    name: Deploy to Azure Container Apps

    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Container Apps extension is available
        run: az extension add --name containerapp --upgrade --yes

      - name: Create or update Azure Container App
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/langgraph-gradio:${{ github.sha }}
        run: |
          APP_EXISTS=$(az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "name" \
            -o tsv 2>/dev/null || true)

          if [ -n "$APP_EXISTS" ]; then
            echo "Container App exists; updating image and env vars..."
            az containerapp update \
              --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE_NAME" \
              --set-env-vars \
                GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
                GROQ_MODEL="${{ secrets.GROQ_MODEL || 'openai/gpt-oss-20b' }}" \
                GRADIO_SERVER_PORT="7860" \
                GRADIO_BROWSER_STORAGE_SECRET="${{ secrets.GRADIO_BROWSER_STORAGE_SECRET }}"
          else
            echo "Container App does not exist; creating a new one..."
            az containerapp create \
              --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINERAPP_ENVIRONMENT }}" \
              --image "$IMAGE_NAME" \
              --target-port 7860 \
              --ingress external \
              --registry-server ghcr.io \
              --registry-username "${{ github.actor }}" \
              --registry-password "${{ secrets.GITHUB_TOKEN }}" \
              --cpu 0.5 \
              --memory 1.0Gi \
              --min-replicas 1 \
              --max-replicas 2 \
              --env-vars \
                GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
                GROQ_MODEL="${{ secrets.GROQ_MODEL || 'openai/gpt-oss-20b' }}" \
                GRADIO_SERVER_PORT="7860" \
                GRADIO_BROWSER_STORAGE_SECRET="${{ secrets.GRADIO_BROWSER_STORAGE_SECRET }}"
          fi

      - name: Show live URL
        run: |
          az containerapp show \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv
